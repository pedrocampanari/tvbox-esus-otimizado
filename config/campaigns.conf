# Lista FIXA de campanhas exibidas pelo kiosk (modo padrão, ver
# docs/memory/known-issues.md item 1 e docs/memory/session-handoff.md).
# Nenhuma requisição é feita a esustv.jfbatl.com.br em tempo de execução
# neste modo — este arquivo é a única fonte de conteúdo.
#
# Formato: blocos "[campanha]" com pares chave=valor. Campos aceitos:
#   tipo             = texto | imagem | video
#   titulo           = texto livre
#   subtitulo        = texto livre (opcional)
#   texto            = corpo do slide de texto (use \n para quebra de linha)
#   imagem_url       = URL de arquivo de imagem (tipo=imagem)
#   video_url        = URL do vídeo (tipo=video). Para youtube/instagram/
#                       facebook, use a URL ORIGINAL do post/vídeo (não a
#                       de embed) — o mpv resolve sozinho via seu hook
#                       ytdl_hook (ver docs/memory/known-issues.md item 5).
#                       Para upload/direto, use a URL do arquivo .mp4/.webm
#                       direto.
#   video_origem     = upload | direto | youtube | instagram | facebook
#   duracao_segundos = inteiro (segundos que o slide fica na tela)
#
# Os 10 video_url abaixo foram confirmados ao vivo em 2026-09-26,
# observando o tráfego de rede do navegador (`read_network_requests`)
# enquanto o painel real rodava em produção — não via JS (isso continua
# bloqueado pelo classificador de segurança do ambiente). Cada URL foi
# reconstruída a partir do embed real do YouTube
# (youtube-nocookie.com/embed/<id> -> youtube.com/watch?v=<id>).
#
# Confiança dos títulos: itens 1-7 foram reconfirmados lendo o texto
# exibido na tela (overlay de carregamento) no momento exato da captura
# de cada video_url. Itens 8-10 foram capturados na mesma sessão e na
# mesma ordem sequencial da rotação (sem pular nenhum), mas o overlay já
# tinha sumido da tela quando tirei o screenshot (vídeo já tocando) —
# então o titulo desses 3 vem da primeira leitura (accessibility tree)
# feita antes, não de uma releitura simultânea à captura da URL. A
# ORDEM/mapeamento pra video_url é confiável (rotação sequencial, sem
# pulos); só o texto exato do titulo desses 3 tem uma origem diferente.
#
# IMPORTANTE sobre duracao_segundos: os valores reais variam muito por
# vídeo (não são um valor único) — alguns transicionam em ~10-20s (ex.:
# "GIRO DA SAUDE"), outros passam de 130s (ex.: "REGULADOR DE FLUXO NO
# UPA"). Não consegui medir a duração exata de cada um (só observei
# ordem de grandeza enquanto esperava a próxima transição). O valor 60
# abaixo é um palpite médio — ajuste por vídeo se souber o valor real
# configurado no painel administrativo.

